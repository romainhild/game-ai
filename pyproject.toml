[project]
name = "ai-rpg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
